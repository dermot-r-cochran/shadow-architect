name: CI

# Runs the suite on every pull request and push to main. TestingStrategy.md
# records why this workflow exists: the suite was once fully dead (invalid
# pyproject.toml plus unparseable source files) for an unknown length of time
# because nothing ran it automatically. The compileall step is the cheap
# parse gate that would have caught that on day one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor (3.10) and current stable.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Parse gate
        # Fails on any unparseable file under src/ even if no test imports
        # it - the exact failure mode of the August 2026 incident.
        run: python -m compileall -q src

      - name: Run tests
        # --cov-fail-under is a ratchet at the measured baseline (89% on
        # 2026-08-24): raise it with the tests that earn it, never lower it.
        run: pytest --cov=shadow_architect --cov-fail-under=89

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        run: ruff check .

  docs:
    name: docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check README and docs
        # Standard library only: relative links resolve, at most one
        # front-matter block per Markdown file, and what the README states
        # (the tests it cites as proof, the module tree) matches the disk.
        run: python .github/scripts/check_docs.py
