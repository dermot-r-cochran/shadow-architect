[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-architect"
version = "0.1.0"
description = "System-level guardrail enforcement for AI systems on Azure Cloud — surfaces constraint violations and gates decisions at defined system boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
    "azure-monitor-opentelemetry>=1.2.0",
    "azure-devops>=7.1.0b4",
    "opentelemetry-sdk>=1.22.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "jinja2>=3.1.2",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
chaos = [
    # The chaos module uses only stdlib and existing dependencies (httpx,
    # unittest.mock) – no additional packages are required.
]

[project.scripts]
shadow-architect = "shadow_architect.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042 (str + Enum -> StrEnum) became reachable when the floor rose to 3.11
# on 2026-11-18. It is not a pure rewrite: StrEnum changes str() and
# format() of a member, which reaches report text and CLI choices, so it is
# left for a change of its own rather than taken with the version bump.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
